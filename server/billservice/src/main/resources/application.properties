spring.application.name=billservice
server.port=8082

# Database Configuration
spring.datasource.url=jdbc:mysql://localhost:3306/payment_hub_users
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA/Hibernate Configuration
spring.jpa.database-platform=org.hibernate.dialect.MySQL8Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# RSA Configuration - for JWT validation
rsa.private-key=classpath:private.key
rsa.public-key=classpath:public.key